name: Build BeagleBone Black image

# A full OpenBMC build takes longer than one GitHub-hosted job may run (6 h).
# Each run builds for up to ~5 h, saves the build cache (sstate), and if the
# image isn't finished yet, starts the next run, which picks up where the
# previous one stopped.

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "Resume counter (set automatically)"
        default: "1"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-beaglebone
  cancel-in-progress: false

env:
  MACHINE: evb-beaglebone
  IMAGE: obmc-phosphor-image
  MAX_ATTEMPTS: "5"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/lib/jvm
          sudo docker image prune --all --force || true
          df -h / /mnt || true

      - name: Pick build directory
        run: |
          root_free=$(df --output=avail -B1 / | tail -1)
          mnt_free=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then base=/mnt; else base=$HOME; fi
          sudo mkdir -p "$base/obmc-build"
          sudo chown "$USER" "$base/obmc-build"
          echo "BUILD_DIR=$base/obmc-build" >> "$GITHUB_ENV"
          echo "Building in $base/obmc-build"

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential chrpath cpio debianutils \
            diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales \
            python3 python3-git python3-jinja2 python3-pexpect python3-subunit \
            socat texinfo unzip wget xz-utils zstd lz4
          sudo locale-gen en_US.UTF-8
          # bitbake isolates tasks with user namespaces, which Ubuntu 24.04's
          # AppArmor policy blocks by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@v4
        with:
          path: openbmc

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/sstate-cache
          key: sstate-${{ env.MACHINE }}-${{ github.run_id }}
          restore-keys: sstate-${{ env.MACHINE }}-

      - name: Build
        id: build
        working-directory: openbmc
        run: |
          export TEMPLATECONF=meta-evb/meta-evb-beaglebone/conf/templates/default
          . ./oe-init-build-env "$BUILD_DIR" > /dev/null
          set +e
          # Leave time at the end of the job to save the cache.
          timeout --signal=INT --kill-after=10m 290m bitbake "$IMAGE"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "bitbake exit code: $rc"
          df -h "$BUILD_DIR"
          # 124 = stopped by the time limit; anything else non-zero is a real failure.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ]; then exit "$rc"; fi
          exit 0

      - name: Save build cache
        if: always() && steps.build.outputs.rc != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/sstate-cache
          key: sstate-${{ env.MACHINE }}-${{ github.run_id }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ env.BUILD_DIR }}/tmp/log/cooker
          if-no-files-found: ignore

      - name: Continue in a new run
        if: steps.build.outputs.rc == '124' || steps.build.outputs.rc == '130'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt=${{ inputs.attempt || '1' }}
          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "::error::Image not finished after $attempt runs; giving up."
            exit 1
          fi
          gh workflow run build-beaglebone.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" -f attempt=$((attempt + 1))

      - name: Collect image
        if: steps.build.outputs.rc == '0'
        run: |
          deploy="$BUILD_DIR/tmp/deploy/images/$MACHINE"
          ls -la "$deploy"
          mkdir -p out
          cp -L "$deploy/$IMAGE-$MACHINE.rootfs.wic.xz" out/
          cp -L "$deploy/$IMAGE-$MACHINE.rootfs.wic.bmap" out/
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out

      - name: Publish release
        if: steps.build.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="beaglebone-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "OpenBMC for BeagleBone Black ($tag)" \
            --notes "Built from ${GITHUB_SHA}. Flash the .wic.xz file to an SD card with balenaEtcher; see meta-evb/meta-evb-beaglebone/README.md."
