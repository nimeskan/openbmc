#@TYPE: Machine
#@NAME: BeagleBone Black OpenBMC evaluation board
#@DESCRIPTION: OpenBMC on the TI AM335x BeagleBone Black, booting from SD/eMMC

# Reuse the Yocto reference BSP for the board (kernel, U-Boot, device trees,
# SD card layout) and make its overrides apply to this machine as well.
require conf/machine/beaglebone-yocto.conf
MACHINEOVERRIDES =. "beaglebone-yocto:"

require conf/machine/include/obmc-evb-common.inc

# Only build the SD/eMMC image; OpenBMC's SPI-flash image types do not apply.
IMAGE_FSTYPES = "wic.xz wic.bmap"

# Not useful for real hardware and they add to the build.
EXTRA_IMAGEDEPENDS:remove = "qemu-native qemu-helper-native"
IMAGE_CLASSES:remove = "qemuboot"

SERIAL_CONSOLES = "115200;ttyS0"
