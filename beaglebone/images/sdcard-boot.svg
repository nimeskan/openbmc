<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>SD card layout and boot sequence</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">What's on the SD card, and how the board boots from it</text>

  <!-- card layout -->
  <text x="30" y="68" font-weight="bold" fill="#222">SD card image (.wic)</text>
  <rect x="30" y="80" width="60" height="110" fill="#eeeeee" stroke="#666" stroke-width="2"/>
  <text x="60" y="122" text-anchor="middle" font-size="11" fill="#333">partition</text>
  <text x="60" y="137" text-anchor="middle" font-size="11" fill="#333">table</text>
  <text x="60" y="152" text-anchor="middle" font-size="11" fill="#333">(MBR)</text>

  <rect x="90" y="80" width="300" height="110" fill="#fff4e0" stroke="#d48a00" stroke-width="2"/>
  <text x="240" y="102" text-anchor="middle" font-weight="bold" fill="#7a4d00">Partition 1: "boot"  FAT, 32 MB</text>
  <text x="104" y="124" font-size="12" fill="#333">MLO  (first-stage loader)</text>
  <text x="104" y="140" font-size="12" fill="#333">u-boot.img  (bootloader)</text>
  <text x="104" y="156" font-size="12" fill="#333">zImage  (Linux kernel)</text>
  <text x="104" y="172" font-size="12" fill="#333">am335x-boneblack.dtb … + extlinux/extlinux.conf</text>

  <rect x="390" y="80" width="580" height="110" fill="#e8f0fe" stroke="#4a6fd1" stroke-width="2"/>
  <text x="680" y="102" text-anchor="middle" font-weight="bold" fill="#1d3b8a">Partition 2: "root"  ext4 (read-write)</text>
  <text x="404" y="124" font-size="12" fill="#333">The whole Linux system: /usr/bin, /etc, /var …</text>
  <text x="404" y="140" font-size="12" fill="#333">systemd (starts everything), dropbear SSH server,</text>
  <text x="404" y="156" font-size="12" fill="#333">bmcweb (web UI + Redfish), phosphor-* D-Bus services,</text>
  <text x="404" y="172" font-size="12" fill="#333">ipmid (IPMI over LAN), entity-manager, dbus-sensors …</text>

  <!-- boot chain -->
  <text x="30" y="240" font-weight="bold" fill="#222">Boot sequence (power on with S2 held = boot from SD)</text>
  <g font-size="12">
    <rect x="30" y="256" width="140" height="80" rx="8" fill="#eeeeee" stroke="#666" stroke-width="2"/>
    <text x="100" y="280" text-anchor="middle" font-weight="bold" fill="#222">Boot ROM</text>
    <text x="100" y="300" text-anchor="middle" fill="#333">built into the</text>
    <text x="100" y="316" text-anchor="middle" fill="#333">AM335x chip</text>

    <rect x="205" y="256" width="140" height="80" rx="8" fill="#fff4e0" stroke="#d48a00" stroke-width="2"/>
    <text x="275" y="280" text-anchor="middle" font-weight="bold" fill="#7a4d00">MLO (SPL)</text>
    <text x="275" y="300" text-anchor="middle" fill="#333">sets up the</text>
    <text x="275" y="316" text-anchor="middle" fill="#333">512 MB RAM</text>

    <rect x="380" y="256" width="140" height="80" rx="8" fill="#fff4e0" stroke="#d48a00" stroke-width="2"/>
    <text x="450" y="280" text-anchor="middle" font-weight="bold" fill="#7a4d00">U-Boot</text>
    <text x="450" y="300" text-anchor="middle" fill="#333">reads extlinux.conf,</text>
    <text x="450" y="316" text-anchor="middle" fill="#333">loads kernel + .dtb</text>

    <rect x="555" y="256" width="140" height="80" rx="8" fill="#fff4e0" stroke="#d48a00" stroke-width="2"/>
    <text x="625" y="280" text-anchor="middle" font-weight="bold" fill="#7a4d00">Linux kernel</text>
    <text x="625" y="300" text-anchor="middle" fill="#333">drivers from the</text>
    <text x="625" y="316" text-anchor="middle" fill="#333">device tree</text>

    <rect x="730" y="256" width="110" height="80" rx="8" fill="#e8f0fe" stroke="#4a6fd1" stroke-width="2"/>
    <text x="785" y="280" text-anchor="middle" font-weight="bold" fill="#1d3b8a">systemd</text>
    <text x="785" y="300" text-anchor="middle" fill="#333">mounts root,</text>
    <text x="785" y="316" text-anchor="middle" fill="#333">starts services</text>

    <rect x="870" y="256" width="110" height="80" rx="8" fill="#e6f6ea" stroke="#2f8f4a" stroke-width="2"/>
    <text x="925" y="280" text-anchor="middle" font-weight="bold" fill="#1d5c2f">OpenBMC</text>
    <text x="925" y="300" text-anchor="middle" fill="#333">ready on</text>
    <text x="925" y="316" text-anchor="middle" fill="#333">the network</text>
  </g>
  <line x1="170" y1="296" x2="203" y2="296" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="296" x2="378" y2="296" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="296" x2="553" y2="296" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="695" y1="296" x2="728" y2="296" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="840" y1="296" x2="868" y2="296" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- dashed links from files to stages -->
  <path d="M130,190 C140,225 260,225 270,254" stroke="#d48a00" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <path d="M220,190 C230,225 430,225 445,254" stroke="#d48a00" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <path d="M310,190 C320,228 600,225 620,254" stroke="#d48a00" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <path d="M680,190 C690,225 775,225 785,254" stroke="#4a6fd1" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="138" y="212" font-size="10" fill="#7a4d00">MLO</text>
  <text x="232" y="212" font-size="10" fill="#7a4d00">u-boot.img</text>
  <text x="322" y="212" font-size="10" fill="#7a4d00">zImage + .dtb</text>
  <text x="694" y="212" font-size="10" fill="#1d3b8a">root filesystem</text>

  <text x="30" y="380" font-size="12" fill="#555">Dashed arrows: which file on the card each boot stage loads.</text>
  <text x="30" y="400" font-size="12" fill="#555">Without S2 held, the Boot ROM tries the onboard eMMC first; once you copy the image to eMMC, the board boots on its own.</text>
  <text x="30" y="420" font-size="12" fill="#555">Serial console (header J1, 3.3 V, 115200 baud) shows every stage's messages.</text>
</svg>
