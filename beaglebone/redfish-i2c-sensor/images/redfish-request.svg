<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>What bmcweb does to answer one Redfish sensor request</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">One request, step by step: GET …/Chassis/BeagleBone_BMC/Sensors/temperature_SIM3_Temperature</text>

  <g font-weight="bold" font-size="13">
    <rect x="30" y="50" width="160" height="34" rx="6" fill="#f2f2f2" stroke="#777"/><text x="110" y="72" text-anchor="middle" fill="#222">Client (curl)</text>
    <rect x="270" y="50" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#4a6fd1"/><text x="350" y="72" text-anchor="middle" fill="#1d3b8a">bmcweb</text>
    <rect x="530" y="50" width="180" height="34" rx="6" fill="#f3e8fd" stroke="#8a4fd1"/><text x="620" y="72" text-anchor="middle" fill="#4f1d8a">ObjectMapper</text>
    <rect x="790" y="50" width="180" height="34" rx="6" fill="#e6f6ea" stroke="#2f8f4a"/><text x="880" y="72" text-anchor="middle" fill="#1d5c2f">externalsensor</text>
  </g>
  <g stroke="#bbb" stroke-dasharray="4 4">
    <line x1="110" y1="84" x2="110" y2="455"/><line x1="350" y1="84" x2="350" y2="455"/>
    <line x1="620" y1="84" x2="620" y2="455"/><line x1="880" y1="84" x2="880" y2="455"/>
  </g>

  <line x1="110" y1="112" x2="346" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="118" y="106" fill="#222">① HTTPS GET + X-Auth-Token</text>
  <rect x="356" y="120" width="190" height="34" rx="4" fill="#fff" stroke="#4a6fd1"/>
  <text x="362" y="134" fill="#222">② check login/privilege; split ID</text>
  <text x="362" y="148" fill="#222">"temperature" + "SIM3_Temperature"</text>

  <line x1="350" y1="180" x2="616" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="358" y="174" fill="#222">③ GetSubTree: all Item.Board / Item.Chassis</text>
  <line x1="620" y1="204" x2="354" y2="204" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="220" fill="#555">…/inventory/system/board/BeagleBone_BMC  ✔ matches "BeagleBone_BMC"</text>

  <line x1="350" y1="250" x2="616" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="358" y="244" fill="#222">④ endpoints of …/BeagleBone_BMC/all_sensors</text>
  <line x1="620" y1="274" x2="354" y2="274" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="290" fill="#555">…/sensors/temperature/SIM3_Temperature, …/voltage/SIM3_Voltage</text>
  <text x="380" y="304" fill="#555">+ which program owns each one (xyz.openbmc_project.ExternalSensor)</text>

  <line x1="350" y1="336" x2="876" y2="336" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="358" y="330" fill="#222">⑤ GetAll properties of …/sensors/temperature/SIM3_Temperature</text>
  <line x1="880" y1="360" x2="354" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="376" fill="#555">Value=25, Unit=DegreesC, MaxValue=127, CriticalHigh=70, WarningAlarmHigh=false, Available=true …</text>

  <line x1="346" y1="420" x2="114" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="122" y="414" fill="#222">⑥ 200 OK + JSON</text>
  <text x="122" y="440" fill="#555" font-family="Courier New, monospace" font-size="11">{"Reading": 25.0, "ReadingUnits": "Cel", "Status": {"Health": "OK"} …}</text>
</svg>
