# /etc/modprobe.d/g_ncm.conf - settings for the USB network gadget (g_ncm)
# Fixed MAC addresses, so the PC sees the same network adapter every time.
# 02:... = "locally administered" addresses, which never clash with real hardware.
#   dev_addr  = the BeagleBone's side (interface usb0)
#   host_addr = the PC's side
options g_ncm dev_addr=02:bb:00:00:00:02 host_addr=02:bb:00:00:00:01 iProduct=BeagleBone-OpenBMC-USB-network
